name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install lightweight dependencies (no torch, runs heuristic baseline)
        run: |
          pip install Flask Flask-SQLAlchemy Flask-Login Werkzeug \
            opencv-python-headless==4.10.0.84 "numpy<2" pytest flake8
      - name: Lint
        run: flake8 . --max-line-length=120 --extend-exclude=venv,.venv --select=E9,F63,F7,F82
      - name: Test
        run: pytest -q
