{% extends "base.html" %}
{% block title %}Sign Up — DeepfakeDetector{% endblock %}

{% block content %}
<div class="auth-wrapper card">
  <h2 class="section-title">Create your account</h2>
  <p class="section-subtitle">Free access to the deepfake detection tool.</p>

  <form method="POST" action="{{ url_for('register') }}">
    <div class="form-group">
      <label for="username">Username</label>
      <input class="form-control" type="text" id="username" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input class="form-control" type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required minlength="6">
    </div>
    <div class="form-group">
      <label for="confirm_password">Confirm Password</label>
      <input class="form-control" type="password" id="confirm_password" name="confirm_password" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Create Account</button>
  </form>

  <p class="auth-footer">
    Already have an account? <a href="{{ url_for('login') }}">Login</a>
  </p>
</div>
{% endblock %}
