{% extends "base.html" %}
{% block title %}Login — DeepfakeDetector{% endblock %}

{% block content %}
<div class="auth-wrapper card">
  <h2 class="section-title">Welcome back</h2>
  <p class="section-subtitle">Log in to analyze videos and view your detection history.</p>

  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-group">
      <label for="username">Username</label>
      <input class="form-control" type="text" id="username" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input class="form-control" type="password" id="password" name="password" required>
    </div>
    <div class="form-check">
      <input type="checkbox" id="remember" name="remember">
      <label for="remember" style="margin:0;">Remember me</label>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Login</button>
  </form>

  <p class="auth-footer">
    Don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
  </p>
</div>
{% endblock %}
